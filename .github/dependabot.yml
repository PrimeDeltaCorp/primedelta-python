version: 2
updates:
  # Python deps (web3/requests/siwe/… and the pinned lint/test tools). Grouped
  # into one PR/week to avoid spam.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # siwe 4.4.0 breaks on abnf 2.9 (redefines core rule ALPHA); main pins abnf<2.9. Don't widen.
      - dependency-name: "abnf"
        versions: [">=2.9"]
    groups:
      python:
        patterns: ["*"]
  # Keep the CI + release workflow actions current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
