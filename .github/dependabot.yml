version: 2
updates:
  # Python deps (web3/requests/siwe/… and the pinned lint/test tools). Grouped
  # into one PR/week to avoid spam.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # siwe 4.4.0 breaks on abnf 2.9 (redefines core rule ALPHA); main pins abnf<2.9. Don't widen.
      - dependency-name: "abnf"
        versions: [">=2.9"]
      # web3 8 conflicts with siwe 4.4.0's pins; revisit when siwe supports web3 8.
      - dependency-name: "web3"
        update-types: ["version-update:semver-major"]
      # isort 9 / mypy 2 are lint-tool majors needing a code-compliance pass; adopt deliberately, not via the weekly group.
      - dependency-name: "isort"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mypy"
        update-types: ["version-update:semver-major"]
    groups:
      python:
        patterns: ["*"]
  # Keep the CI + release workflow actions current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
